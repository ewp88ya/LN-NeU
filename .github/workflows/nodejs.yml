name: LN-NeU CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:


  backend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 22


      - run: npm install

      - run: npm run build



  frontend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 22


      - run: npm install

      - run: npm run build



  ai:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai


    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Python Compile Check
        run: |
          python -m py_compile main.py
          python -m py_compile workflows/engine.py
          python -m py_compile task_queue/*.py
          python -m py_compile observability/*.py
          python -m py_compile router/*.py


      - name: Sprint 17 Queue Integration Test
        run: |
          python task_queue/test_sprint17_integration.py


      - name: Sprint 17 Queue Stress Test
        run: |
          python task_queue/test_sprint17_stress.py



  docker:

    runs-on: ubuntu-latest


    steps:

      - uses: actions/checkout@v4


      - name: Validate Docker Compose
        run: |
          docker compose \
          -f docker-compose.production.yml \
          config


      - name: Docker Build Verification
        run: |
          docker compose \
          -f docker-compose.production.yml \
          build
