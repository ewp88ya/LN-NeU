name: LN-NeU CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build



  frontend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build


  ai:

    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ai

    env:
      PYTHONPATH: ${{ github.workspace }}/LN-NeU/ai
      REDIS_URL: redis://localhost:6379

    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Python Compile Check
        run: |
          python -m py_compile main.py
          python -m py_compile workflows/engine.py
          python -m py_compile task_queue/*.py
          python -m py_compile observability/*.py
          python -m py_compile router/*.py


      - name: Sprint 17 Queue Integration Test
        run: |
          python -m task_queue.test_sprint17_integration


      - name: Sprint 17 Queue Stress Test
        run: |
          python -m task_queue.test_sprint17_stress



  docker:

    runs-on: ubuntu-latest


    steps:

      - uses: actions/checkout@v4


      - name: Validate production Compose and build release images
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > .env.production <<'EOF'
          ENVIRONMENT=production
          POSTGRES_USER=ci_lnneu
          POSTGRES_PASSWORD=ci-only-not-for-deployment
          POSTGRES_DB=lnneu_ci
          DATABASE_URL=postgresql://ci_lnneu:ci-only-not-for-deployment@postgres:5432/lnneu_ci
          REDIS_URL=redis://redis:6379
          OLLAMA_URL=http://ollama:11434/api/generate
          OLLAMA_MODEL=qwen2.5:7b
          SANTOR_API_KEY=ci-only-placeholder-secret-not-for-production-0001
          AI_PORT=8000
          GHCR_OWNER=ewp88ya
          VERSION=ci-validation
          EOF
          trap 'rm -f .env.production' EXIT

          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
          docker compose --env-file .env.production -f docker-compose.production.yml config --images

          docker build -t ghcr.io/ewp88ya/ln-neu-core:ci-validation ./backend
          docker build -t ghcr.io/ewp88ya/ln-neu-ai:ci-validation ./ai
          docker tag ghcr.io/ewp88ya/ln-neu-ai:ci-validation ghcr.io/ewp88ya/ln-neu-ai-worker:ci-validation
