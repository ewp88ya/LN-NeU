name: LN-NeU Test Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend-test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build


  ai-test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Python validation
        run: |
          python -m py_compile main.py
          python -m py_compile workflows/engine.py
          python -m py_compile task_queue/*.py
          python -m py_compile router/*.py
          python -m py_compile observability/*.py


  docker-validation:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - name: Docker Compose Validation
        run: |
          docker compose \
          --env-file .env.production \
          -f docker-compose.production.yml \
          config


  integration-test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - name: Integration placeholder
        run: |
          echo "Integration test stage ready"
