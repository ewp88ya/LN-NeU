name: LN-NeU Test Pipeline


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main



jobs:


  backend-test:


    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: backend


    steps:


      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install Backend Dependencies
        run: npm install


      - name: Backend Build
        run: npm run build





  ai-test:


    runs-on: ubuntu-latest

    env:
      AI_PROVIDER: mock
      EMBEDDING_PROVIDER: mock


    defaults:
      run:
        working-directory: ai


    steps:


      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"



      - name: Install AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest



      - name: Python Syntax Validation
        run: |
          python -m py_compile main.py
          python -m py_compile workflows/engine.py
          python -m py_compile task_queue/*.py
          python -m py_compile router/*.py
          python -m py_compile observability/*.py



      - name: Run AI Tests
        run: |
          pytest





  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose and build release images
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > .env.production <<'EOF'
          ENVIRONMENT=production
          POSTGRES_USER=ci_lnneu
          POSTGRES_PASSWORD=ci-only-not-for-deployment
          POSTGRES_DB=lnneu_ci
          DATABASE_URL=postgresql://ci_lnneu:ci-only-not-for-deployment@postgres:5432/lnneu_ci
          REDIS_URL=redis://redis:6379
          AI_PROVIDER=mock
          OLLAMA_URL=http://ollama:11434/api/generate
          OLLAMA_MODEL=qwen2.5:7b
          SANTOR_API_KEY=ci-only-placeholder-secret-not-for-production-0001
          AI_PORT=8000
          GHCR_OWNER=ewp88ya
          VERSION=ci-validation
          EOF

          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
          docker compose --env-file .env.production -f docker-compose.production.yml config --images
          docker build -t ghcr.io/ewp88ya/ln-neu-core:ci-validation ./backend
          docker build -t ghcr.io/ewp88ya/ln-neu-ai:ci-validation ./ai
          docker tag ghcr.io/ewp88ya/ln-neu-ai:ci-validation ghcr.io/ewp88ya/ln-neu-ai-worker:ci-validation
          rm -f .env.production

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create isolated CI environment and test-only port override
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > .env.production <<'EOF'
          ENVIRONMENT=production
          POSTGRES_USER=ci_lnneu
          POSTGRES_PASSWORD=ci-only-not-for-deployment
          POSTGRES_DB=lnneu_ci
          DATABASE_URL=postgresql://ci_lnneu:ci-only-not-for-deployment@postgres:5432/lnneu_ci
          REDIS_URL=redis://redis:6379
          AI_PROVIDER=mock
          OLLAMA_URL=http://ollama:11434/api/generate
          OLLAMA_MODEL=qwen2.5:7b
          SANTOR_API_KEY=ci-only-placeholder-secret-not-for-production-0001
          AI_PORT=8000
          GHCR_OWNER=ewp88ya
          VERSION=ci-validation
          SANTOR_API_KEY=ci-only-placeholder-secret-not-for-production-0001
          EOF
          cat > docker-compose.ci.yml <<'EOF'
          services:
            ln-neu-ai:
              ports:
                - "127.0.0.1:8100:8000"
          EOF

      - name: Build AI image for integration tests
        run: docker build -t ghcr.io/ewp88ya/ln-neu-ai:ci-validation ./ai

      - name: Start test services
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.ci.yml up -d postgres redis ln-neu-ai

      - name: Wait for AI health check
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' ln-neu-ai 2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.ci.yml logs ln-neu-ai redis postgres
          exit 1

      - name: Verify PostgreSQL backup and restore
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' ln-neu-postgres 2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' ln-neu-postgres)" = "healthy"
          docker exec ln-neu-postgres psql -U ci_lnneu -d lnneu_ci -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE ci_backup_probe (id integer PRIMARY KEY, note text);" \
            -c "INSERT INTO ci_backup_probe (id, note) VALUES (1, 'backup-restore-ok');"
          docker exec ln-neu-postgres pg_dump -U ci_lnneu -d lnneu_ci --no-owner --no-privileges > "$RUNNER_TEMP/lnneu-backup.sql"
          test -s "$RUNNER_TEMP/lnneu-backup.sql"
          docker exec ln-neu-postgres createdb -U ci_lnneu lnneu_restore_ci
          docker exec -i ln-neu-postgres psql -U ci_lnneu -d lnneu_restore_ci -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/lnneu-backup.sql"
          restored_rows="$(docker exec ln-neu-postgres psql -U ci_lnneu -d lnneu_restore_ci -At -c "SELECT COUNT(*) FROM ci_backup_probe WHERE id = 1 AND note = 'backup-restore-ok'")"
          test "$restored_rows" = "1"
          docker exec ln-neu-postgres dropdb -U ci_lnneu --if-exists lnneu_restore_ci
          rm -f "$RUNNER_TEMP/lnneu-backup.sql"

      - name: Run integration tests (fail on errors)
        env:
          SANTOR_API_KEY: ci-only-placeholder-secret-not-for-production-0001
        run: python -m pip install --upgrade pytest && pytest -q tests/integration

      - name: Shutdown test services
        if: always()
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.ci.yml down -v || true
          rm -f .env.production docker-compose.ci.yml
