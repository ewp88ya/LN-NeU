name: LN-NeU Test Pipeline


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main



jobs:


  backend-test:


    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: backend


    steps:


      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json


      - name: Install Backend Dependencies
        run: npm install


      - name: Backend Build
        run: npm run build





  ai-test:


    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: ai


    steps:


      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"



      - name: Install AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest



      - name: Python Syntax Validation
        run: |
          python -m py_compile main.py
          python -m py_compile workflows/engine.py
          python -m py_compile task_queue/*.py
          python -m py_compile router/*.py
          python -m py_compile observability/*.py



      - name: Run AI Tests
        run: |
          pytest





  docker-validation:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI Environment
        run: |
          cp .env.test .env.production

      - name: Docker Compose Validation
        run: |
          docker compose \
          --env-file .env.production \
          -f docker-compose.production.yml \
          config



      - name: Docker Build Verification
        run: |
          docker compose \
          --env-file .env.production \
          -f docker-compose.production.yml \
          build





  integration-test:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI Environment
        run: |
          cat > .env.production <<EOF
          ENVIRONMENT=test
          POSTGRES_USER=lnneu
          POSTGRES_PASSWORD=test
          POSTGRES_DB=lnneu
          DATABASE_URL=postgresql://lnneu:test@postgres:5432/lnneu
          REDIS_URL=redis://redis:6379
          OLLAMA_URL=http://localhost:11434/api/generate
          OLLAMA_MODEL=qwen2.5:7b
          AI_PORT=8000
          GHCR_OWNER=ewp88ya
          VERSION=test
          EOF


      - name: Start Test Services
        run: |
          docker compose \
          --env-file .env.production \
          -f docker-compose.production.yml \
          up -d postgres redis ln-neu-ai



      - name: Wait Services
        run: |
          sleep 20



      - name: Service Health Check
        run: |
          docker ps

          docker inspect \
          --format='{{.State.Health.Status}}' \
          ln-neu-ai || true



      - name: Install Test Tools
        run: |
          python3 -m pip install pytest requests



      - name: Run Integration Test
        run: |
          pytest tests/integration || true



      - name: Shutdown Services
        if: always()
        run: |
          docker compose \
          --env-file .env.production \
          -f docker-compose.production.yml \
          down
