services:

  postgres:
    image: postgres:16

    container_name: ln-neu-postgres

    restart: always

    env_file:
      - .env.production

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

    networks:
      - lnneu-network



  redis:
    image: redis:7

    container_name: ln-neu-redis

    restart: always


    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

    networks:
      - lnneu-network


  ln-neu-ai:

    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/ln-neu-ai:${VERSION:?VERSION is required}

    container_name: ln-neu-ai

    restart: always

    env_file:
      - .env.production

    environment:

      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be set}

      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER must be set}

      SANTOR_API_KEY: ${SANTOR_API_KEY:?SANTOR_API_KEY must be set}

      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}

      OLLAMA_URL: ${OLLAMA_URL:?OLLAMA_URL must be set}

      OLLAMA_MODEL: ${OLLAMA_MODEL:?OLLAMA_MODEL must be set}




    depends_on:

      redis:
        condition: service_healthy


    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]

      interval: 30s
      timeout: 10s
      retries: 3


    logging:

      driver: json-file

      options:
        max-size: "10m"
        max-file: "5"


    deploy:

      resources:

        limits:

          cpus: "2"

          memory: 3G


    networks:

      - lnneu-network



  ln-neu-ai-worker:

    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/ln-neu-ai-worker:${VERSION:?VERSION is required}


    container_name: ln-neu-ai-worker


    restart: always


    command:

      python -m task_queue.runner


    env_file:

      - .env.production



    environment:

      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be set}

      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER must be set}

      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}

      OLLAMA_URL: ${OLLAMA_URL:?OLLAMA_URL must be set}

      OLLAMA_MODEL: ${OLLAMA_MODEL:?OLLAMA_MODEL must be set}



    depends_on:


      redis:

        condition: service_healthy


      ln-neu-ai:

        condition: service_healthy



    healthcheck:


      test:

        [
          "CMD-SHELL",
          "python -c \"import redis; redis.Redis(host='redis').ping()\""
        ]


      interval: 30s

      timeout: 10s

      retries: 3



    logging:


      driver: json-file


      options:

        max-size: "10m"

        max-file: "5"



    deploy:


      resources:


        limits:


          cpus: "2"

          memory: 2G



    networks:


      - lnneu-network





  ln-neu-core:


    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/ln-neu-core:${VERSION:?VERSION is required}



    container_name: ln-neu-core


    restart: always



    env_file:

      - .env.production



    environment:


      NODE_ENV: ${ENVIRONMENT}


      DATABASE_URL: ${DATABASE_URL}



    expose:

      - "3000"



    depends_on:


      postgres:

        condition: service_healthy


      redis:

        condition: service_healthy


      ln-neu-ai:

        condition: service_healthy



    logging:


      driver: json-file


      options:


        max-size: "10m"


        max-file: "5"



    deploy:


      resources:


        limits:


          cpus: "2"


          memory: 2G



    networks:


      - lnneu-network






  nginx:


    image: nginx:latest



    container_name: ln-neu-nginx



    restart: always



    ports:


      - "80:80"



    volumes:


      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro



    depends_on:


      ln-neu-core:

        condition: service_started


      ln-neu-ai:

        condition: service_healthy



    logging:


      driver: json-file


      options:


        max-size: "10m"


        max-file: "5"



    deploy:


      resources:


        limits:


          cpus: "1"


          memory: 512M



    networks:


      - lnneu-network






volumes:


  postgres_data:






networks:


  lnneu-network:


    driver: bridge
